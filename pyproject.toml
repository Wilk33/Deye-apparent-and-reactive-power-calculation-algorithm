[build-system]
requires=["setuptools>=77"]
build-backend="setuptools.build_meta"

[project]
name="deye-power-calculation"
version="0.1.0"
description="Obliczanie mocy pozornej i biernej na podstawie danych falownika Deye"
readme="README.md"
requires-python=">=3.10"
license="Apache-2.0"
authors=[
	{name="Wilk33"},
]
dependencies=[
	"numpy>=1.24",
	"pandas>=2.0",
]

[project.scripts]
deye-model="deye_power_calculation.model_deye:main"

[project.optional-dependencies]
dev=[
	"pytest>=8",
	"ruff>=0.12",
]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100
target-version="py310"
